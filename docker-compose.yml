services:
  whatsapp:
    build: .
    container_name: whatsapp-sender
    ports:
      - "4001:4001"
    env_file:
      - .env
    environment:
      - CHROME_PATH=/usr/bin/chromium
      - HEADLESS=true
    volumes:
      # الحفاظ على الجلسة والطابور بعد إعادة التشغيل
      - ./data:/app/data
      - wwebjs_auth:/app/.wwebjs_auth
    restart: unless-stopped
    # مهم: ذاكرة كافية لـ Chromium
    shm_size: 1gb

volumes:
  wwebjs_auth:
